<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Workforce Request Management Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body{
            font-family: 'Segoe UI', sans-serif;
            background:#f4f8fc;
            margin:0;
        }

        /* HEADER */
        header{
            background-color:#b9d6f7;
            padding:15px 40px;
            box-shadow:0 4px 10px rgba(0,0,0,0.08);
        }

        .header-content{
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logo{
            height:45px;
        }

        .header-buttons button{
            margin-left:10px;
            padding:8px 18px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:600;
            transition:.2s;
        }

        .report-btn{
            background:white;
            color:#0b3c5d;
        }

        .logout-btn{
            background:#0b3c5d;
            color:white;
        }

        .header-buttons button:hover{
            transform:translateY(-2px);
        }

        .container{
            padding:30px 40px;
        }

        /* KPIs */
        .kpis{
            display:grid;
            grid-template-columns: repeat(6,1fr);
            gap:18px;
            margin-bottom:30px;
        }

        .card{
            background:white;
            padding:22px;
            border-radius:14px;
            box-shadow:0 8px 20px rgba(0,0,0,0.08);
            text-align:center;
            border-top:5px solid #b9d6f7;
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-6px);
        }

        .card h3{
            margin:0;
            font-size:14px;
            color:#6b7280;
        }

        .card h2{
            margin-top:10px;
            font-size:28px;
            color:#2c3e50;
        }

        .charts{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
            margin-bottom:25px;
        }

        .chart-box{
            background:white;
            padding:20px;
            border-radius:14px;
            box-shadow:0 6px 18px rgba(0,0,0,0.08);
        }

        #pieChart{
            max-width:260px;
            max-height:260px;
            margin:0 auto;
        }

        .filters{
            display:flex;
            gap:20px;
            align-items:center;
            flex-wrap:wrap;
            margin-bottom:25px;
        }

        .filters select,
        .filters input{
            padding:12px 18px;
            border-radius:12px;
            border:2px solid #e3eaf3;
            background-color:#ffffff;
            font-size:14px;
            transition:all .25s ease;
            box-shadow:0 2px 6px rgba(0,0,0,0.05);
            outline:none;
        }

        .filters input{
            min-width:260px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            border-radius:14px;
            overflow:hidden;
            box-shadow:0 6px 18px rgba(0,0,0,0.08);
        }

        th{
            background:#b9d6f7;
            color:white;
            padding:14px;
        }

        td{
            padding:12px;
            text-align:center;
            border-bottom:1px solid #eef2f7;
        }

        tr:hover{
            background:#f1f7ff;
        }

        .pending{
            background:#fde68a;
            padding:5px 10px;
            border-radius:10px;
            font-weight:bold;
        }

        .completed{
            background:#bbf7d0;
            padding:5px 10px;
            border-radius:10px;
            font-weight:bold;
        }

        .dashboard-desc{
            color:#64748b;
            margin-bottom:15px;
        }

        @media(max-width:1200px){
            .kpis{
                grid-template-columns: repeat(3,1fr);
            }

            .charts{
                grid-template-columns:1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-content">
        <img src="/images/medtronic-logo.png" alt="Medtronic Logo" class="logo">

        <div class="header-buttons">
            <button type="button"
                    class="logout-btn"
                    onclick="window.location.href='/analyst/logout'">
                Logout
            </button>
        </div>
    </div>
</header>

<div class="container">

    <!-- KPI -->
    <div class="kpis">

        <div class="card">
            <h3>Total Requests</h3>
            <h2 th:text="${totalSolicitudes}">0</h2>
        </div>

        <div class="card">
            <h3>Attendance</h3>
            <h2 th:text="${datosTipo[0][1]}">0</h2>
        </div>

        <div class="card">
            <h3>Schedule Change</h3>
            <h2 th:text="${datosTipo[1][1]}">0</h2>
        </div>

        <div class="card">
            <h3>General Request</h3>
            <h2 th:text="${datosTipo[2][1]}">0</h2>
        </div>

        <div class="card">
            <h3>Pending</h3>
            <h2 id="pendingCount">0</h2>
        </div>

        <div class="card">
            <h3>Completed</h3>
            <h2 id="completedCount">0</h2>
        </div>

    </div>

    <!-- Charts -->
    <div class="charts">

        <div class="chart-box">
            <h3>Requests by Type</h3>
            <canvas id="barChart"></canvas>
        </div>

        <div class="chart-box">
            <h3>Status Distribution</h3>
            <canvas id="pieChart"></canvas>
        </div>

    </div>

    <!-- Filters -->
    <p class="dashboard-desc">
        Monitor workforce requests and track request status in real time.
    </p>

    <div class="filters">

        <select id="filterType">
            <option value="">All Types</option>
            <option>Attendance</option>
            <option>Schedule Change</option>
            <option>General Request</option>
        </select>

        <select id="filterStatus">
            <option value="">All Status</option>
            <option>Pending</option>
            <option>Completed</option>
        </select>

        <input type="text"
               id="searchInput"
               placeholder="Search by name...">

    </div>

    <!-- TABLE -->
    <h3 style="margin-bottom:10px;color:#334155;">
        Latest Requests
    </h3>

    <table id="requestsTable">

        <thead>
        <tr>
            <th>ID</th>
            <th>Submitted By</th>
            <th>Request Type</th>
            <th>Status</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="s,iter : ${solicitudes}"
            th:if="${iter.index < 10}">

            <td th:text="${s['id']}"></td>

            <td th:text="${s['submittedBy']}"></td>

            <td th:text="${s['requestType']}"></td>

            <td>
                <span th:text="${s['status']}"
                      th:classappend="${s['status'] == 'Pending'} ? 'pending' : 'completed'">
                </span>
            </td>

        </tr>

        </tbody>

    </table>

</div>

<script th:inline="javascript">

    let datos = /*[[${datosTipo}]]*/ [];

    let labels = datos.map(d => d[0]);
    let values = datos.map(d => d[1]);

    // BAR CHART
    new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                data: values
            }]
        },
        options: {
            responsive: true
        }
    });

    // COUNTS
    let rows = document.querySelectorAll("#requestsTable tbody tr");

    let pending = 0;
    let completed = 0;

    rows.forEach(r => {

        let status = r.cells[3].innerText.trim();

        if(status === "Pending"){
            pending++;
        }else{
            completed++;
        }

    });

    document.getElementById("pendingCount").innerText = pending;
    document.getElementById("completedCount").innerText = completed;

    // PIE CHART
    new Chart(document.getElementById('pieChart'), {
        type: 'pie',
        data: {
            labels: ['Pending', 'Completed'],
            datasets: [{
                data: [pending, completed]
            }]
        }
    });

    // FILTERS
    document.querySelectorAll("#filterType,#filterStatus,#searchInput")
        .forEach(el => el.addEventListener("input", filterTable));

    function filterTable(){

        let type = filterType.value.toLowerCase();
        let status = filterStatus.value.toLowerCase();
        let search = searchInput.value.toLowerCase();

        rows.forEach(r => {

            let t = r.cells[2].innerText.toLowerCase();
            let s = r.cells[3].innerText.toLowerCase();
            let name = r.cells[1].innerText.toLowerCase();

            r.style.display =
                ((!type || t.includes(type)) &&
                    (!status || s.includes(status)) &&
                    (!search || name.includes(search)))
                    ? ""
                    : "none";
        });
    }

</script>

</body>
</html>
